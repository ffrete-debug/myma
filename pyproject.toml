[project]
name = "ark-server-commander"
version = "0.1.0"
description = "ARK Server Commander - Web UI for managing ARK servers in Docker"
authors = [
    {name = "ffrete-debug"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
# pyyaml / requests / python-dotenv were declared but imported by nothing in
# this repo. The last third-party import was selenium, used by the dev-only
# helper smoke_test.py; that script has since been removed, so no Python
# dependency remains.
dependencies = []


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
