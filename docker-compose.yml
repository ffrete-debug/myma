version: '3.8'

services:
  ark-server-manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # GID of the host's "docker" group, so the non-root runtime user can
        # open /var/run/docker.sock. Find it with:
        #   stat -c '%g' /var/run/docker.sock
        DOCKER_GID: ${DOCKER_GID:-999}
    container_name: ark-server-manager
    ports:
      - "8080:8080"
      - "3000:3000"
    # Game servers run as separate containers and publish their RCON port on the
    # host. This container reaches them through the host gateway, so RCON_HOST
    # defaults to host.docker.internal — which only resolves if we map it here.
    # Without this, every RCON dial fails.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - ./data:/data
      # Required: the app manages ARK game-server containers via the Docker SDK.
      # :ro only makes the socket file itself read-only on the bind; the Docker
      # API reached through it is still fully read-write. Defence in depth only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 10s

volumes:
  data:
