name: CI

on:
  push:
    branches: [main, dev/**]
  pull_request:
    # Stacked PRs target their parent branch rather than main, so restricting
    # this to [main] silently skipped CI on every PR but the bottom of a stack.
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'dev/**']
    # `edited` matters for stacks specifically: retargeting a PR's base (either
    # by hand or by GitHub after the parent merges) fires only `edited`. Without
    # it a retargeted PR keeps whatever checks it had against the OLD base — or,
    # if the old base was an unlisted branch, no checks at all — and can then be
    # merged into main having never been tested against it.
    types: [opened, synchronize, reopened, edited]

# Least privilege: CI only reads the repo. Individual jobs narrow further.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by golangci-lint-action's `only-new-issues`, which reads the
      # PR diff from the GitHub API to decide which findings are new.
      pull-requests: read
    defaults:
      run:
        working-directory: server

    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.24'
        cache: true
        cache-dependency-path: server/go.sum

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: golangci-lint
      # Pinned to a commit SHA: this action downloads and executes a binary,
      # so a moved tag would be a supply-chain foothold.
      uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
      with:
        version: v2.12.2
        # `defaults.run.working-directory` does not apply to `uses:` steps.
        working-directory: server
        # The repo has 28 pre-existing findings (21 errcheck, 5 staticcheck,
        # 2 unused). Gating on all of them would leave CI permanently red, so
        # this ratchets: the backlog is tolerated, but every new or modified
        # line is fully linted, errcheck included. Drop this flag once the
        # backlog reaches zero. Supported on both pull_request and push.
        only-new-issues: true

    - name: Test
      run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'ui/package-lock.json'

    - name: Install
      run: npm ci

    # Hard gate. Scoped to dependencies that actually ship in the Docker
    # image - a vulnerable test runner is not a production exposure. This
    # step has no `|| true`: a critical CVE reaching runtime code fails CI.
    - name: Audit (production dependencies)
      run: npm audit --omit=dev --audit-level=critical

    # Advisory. The full tree currently has 15 high/critical advisories whose
    # only remedies are major-version changes to next/vitest/eslint, so this
    # cannot be a hard gate today without freezing the build. Unlike the old
    # `|| true`, a failure here shows as a red step and a job annotation
    # instead of being swallowed into a green check.
    - name: Audit (full tree, advisory)
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Typecheck
      # `next build` typechecks too, but this fails in seconds with a clearer
      # error instead of several minutes into a bundle.
      run: npx tsc --noEmit

    - name: Lint
      run: npm run lint

    - name: Test
      run: npm test

    - name: Build
      run: npm run build
