name: Build and Push Docker Image

on:
  push:
    tags: [ 'v*' ]

env:
  REGISTRY: tbro98
  IMAGE_NAME: arkservercommander

# Default for any job that does not set its own block.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # id-token + attestations back the "Generate artifact attestation" step
      # below. They are no longer granted speculatively.
      # `packages: write` was removed: it grants access to GHCR, and this
      # workflow publishes to Docker Hub via DOCKERHUB_TOKEN instead.
      id-token: write
      attestations: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to Docker Hub
      # Pinned to a commit SHA: this action receives DOCKERHUB_TOKEN, which
      # makes it the highest-value target in the workflow.
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ env.REGISTRY }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Previously commented out while the job still requested id-token and
    # attestations, so every release advertised provenance it never produced.
    # Now enabled, with `push-to-registry` left at its default of false: the
    # attestation is stored in GitHub's attestation API rather than written
    # back to Docker Hub as an OCI referrer. That is what the original note
    # was worried about, and it is the part that depends on registry-side
    # referrers support - generating and signing the provenance itself does
    # not. Verify a published image with:
    #
    #   gh attestation verify \
    #     oci://docker.io/tbro98/arkservercommander:<tag> \
    #     --repo <owner>/<repo>
    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: docker.io/${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.build.outputs.digest }}
