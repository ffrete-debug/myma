name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the source it measures.
# Codecov's PR comment is posted by the Codecov app, not by GITHUB_TOKEN, so
# no write scope is required here.
permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true
        cache-dependency-path: server/go.sum
    - run: go test ./... -coverprofile=coverage.out -covermode=atomic
    - run: go tool cover -func=coverage.out
    - name: Upload to Codecov
      # Pinned to a commit SHA: this action runs a downloaded uploader binary
      # with access to the repo token.
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: server/coverage.out
        # Keep false: a Codecov outage should not fail an otherwise good
        # build. The coverage gate itself lives in /codecov.yml and is
        # enforced by Codecov's own status checks.
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
